[tool.poetry]
name = "unified-ontology-kernel"
version = "0.1.0"
description = "Kernel Gate service for the Unified Operating Ontology"
authors = ["Gemini"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "==0.111.1"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
rdflib = "==6.3.2" # Downgrading rdflib for testing
pyshacl = "==0.27.0"
pytest = "^8.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]